<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2540">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>neet pg timetable</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1f8;--surface:#fff;--ink:#241f35;--mute:#6d6784;--line:#e2deee;--now:#fff3c4;
--c1:#4b55d1;--c2:#c2571a;--c3:#2f8f6b;--c4:#c23a6b;--c5:#7a3fc4;--c6:#1f7a9c;--c7:#6d6784;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#17131f;--surface:#221c2e;--ink:#eeeaf8;--mute:#a49dbd;--line:#352d45;--now:#4a3d12}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#17131f;--surface:#221c2e;--ink:#eeeaf8;--mute:#a49dbd;--line:#352d45;--now:#4a3d12}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;margin:0;line-height:1.15}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.top h1{font-size:30px}
.top p{margin:6px 0 0;color:var(--mute)}
.hero{margin:18px 0 22px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.hero b{font-family:'Bricolage Grotesque',sans-serif;font-size:28px}
.hero span{color:var(--mute);display:block;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:132px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--a)}
.card:focus-visible,.back:focus-visible,.tab:focus-visible{outline:3px solid var(--a,var(--c1));outline-offset:2px}
.card:active{transform:scale(.98)}
.card .e{font-size:26px}
.card h2{font-size:18px;margin-top:8px}
.card small{color:var(--mute);font-size:13px}
.card.wide{grid-column:span 2;min-height:96px}
.sheet{display:none}
.sheet.on{display:block}
.back{all:unset;cursor:pointer;color:var(--mute);font-weight:600;padding:6px 0;margin-bottom:8px;display:inline-block}
.head{border-top:6px solid var(--a);background:var(--surface);border-radius:18px;padding:16px;margin-bottom:14px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.head h2{font-size:26px}
.head p{margin:6px 0 0;color:var(--mute);font-size:15px}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.tab{all:unset;cursor:pointer;white-space:nowrap;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:var(--a);border-color:var(--a);color:#fff}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-weight:600;color:var(--a);font-size:14px}
.row .w{font-weight:500}
.row .n{display:block;color:var(--mute);font-size:13.5px}
.row.now{background:var(--now);box-shadow:inset 5px 0 0 var(--a)}
.row.item{grid-template-columns:1fr}
.note{margin:12px 2px 0;color:var(--mute);font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--now);color:var(--ink);margin-left:6px}
.themebtn{all:unset;cursor:pointer;float:right;font-size:20px;padding:4px}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .12s}}
</style>
</head>
<body>
<main>
<div id="home">
  <div class="top"><button class="themebtn" id="th" aria-label="toggle dark mode">🌓</button><h1>neet pg plan</h1><p>exam may 2027 · first reading done by feb 14</p></div>
  <div class="hero"><b id="cd">–</b><span id="cds">days left to finish the first reading</span></div>
  <div class="grid" id="grid"></div>
</div>
<div id="sheets"></div>
</main>
<script>
var M=function(t){var p=t.split(':');return +p[0]*60+ +p[1]};
var D=[
{id:'normal',e:'📚',name:'normal day',sub:'mon to fri, no shift',a:'--c1',live:1,
 intro:'6.5 hrs of videos and notes, 1 hr qbank. 50 min on, 10 min off.',
 rows:[['06:30','07:00','wake up','water, no phone'],['07:00','08:00','exercise or walk','4 days a week, see exercise card'],['08:00','09:00','breakfast + free'],['09:00','12:30','block 1','videos + handwritten notes'],['12:30','14:00','lunch + rest','short walk, no scrolling'],['14:00','17:30','block 2','videos + handwritten notes'],['17:30','18:00','break'],['18:00','19:00','qbank','20-30 questions on today\'s topics, then 15 min recap of notes'],['19:00','20:00','recording slot','tue + thu. free on other days'],['20:00','21:00','dinner'],['21:00','22:00','chill','no study'],['22:45','23:59','sleep']]},
{id:'shift',e:'🏥',name:'shift day',sub:'3-4 hrs max',a:'--c2',
 tabs:[
 {n:'morning shift',intro:'no exercise today.',rows:[['before leaving','1.5 hrs study','videos + notes'],['commute','rest','listen to audio or nothing'],['after getting back','1.5 hrs study','finish the topic'],['evening','20 qbank questions'],['night','early sleep']]},
 {n:'night shift',intro:'protect the sleep first.',rows:[['morning','sleep till ~1 pm'],['before leaving','2 hrs study','videos + notes'],['commute','qbank on phone if possible'],['shift','no study']]},
 {n:'day after night',intro:'light only. no new topics.',rows:[['wake up','sleep as long as needed'],['afternoon','1.5 hrs light study','qbank or revise notes'],['rest of day','nothing else']]}],
 foot:'missed modules go to the sunday catch-up. never double up the next day.'},
{id:'weekend',e:'🌤',name:'weekend',sub:'half day off',a:'--c3',live:1,
 intro:'study in the morning, off from 1 pm. no guilt.',
 rows:[['07:30','08:30','sat: workout or ride','sun: long ride or full rest'],['09:00','12:30','study block','sat: videos + notes. sun: catch-up (below)'],['13:00','23:00','off','rest, family, shows, friends'],['15:00','17:00','recording','saturday, every alternate weekend only']],
 foot:'sunday catch-up: clear missed modules, 1 hr revision of the week\'s notes, then a 30 q mixed test.'},
{id:'exercise',e:'🏃‍♀️',name:'exercise',sub:'4 days a week',a:'--c4',
 intro:'enough to stay sharp without hurting prep.',
 items:[['mon','home workout','45-60 min'],['wed','run','40-50 min easy'],['fri','home workout','45-60 min'],['sat or sun','ride','long, easy pace. swap for a run if tired']],
 foot:'skip training on shift days and the day after a night shift.'},
{id:'singing',e:'🎤',name:'singing',sub:'recording days',a:'--c5',
 intro:'only recording. he edits.',
 items:[['tue evening','7-8 pm','recording session'],['thu evening','7-8 pm','recording session'],['sat afternoon','3-5 pm','extra session, every alternate weekend'],['before each session','10 min warm-up','water, quiet room']],
 foot:'if a shift lands on a recording day, move it to the next free evening.'},
{id:'order',e:'🗺',name:'study order',sub:'first reading',a:'--c6',
 intro:'weak subjects first, anatomy last. estimate ~110 modules a week. update after week 1.',
 items:[['1. path, micro, pharm','244 modules','done ~dec 10'],['2. physio, biochem, forensics','160 modules','done ~dec 20'],['3. psm, ent, ophthal','217 modules','done ~jan 1'],['4. medicine, derm, psych, anaesthesia','280 modules','done ~jan 18'],['5. surgery, obg, peds, ortho, radio','319 modules','done ~feb 8'],['6. anatomy, high-yield only','91 modules','feb 8-14']],
 foot:'ahead of pace? anatomy comes back in full.'},
{id:'rules',e:'🛟',name:'rules + buffer',sub:'when life happens',a:'--c7',wide:1,
 intro:'so a bad week never wrecks the plan.',
 items:[['week 1','calibration. track modules done per day.'],['sunday','catch-up, revision, 30 q test.'],['every 3rd week','one sunday is full revision + qbank test.'],['behind by 25+ modules','trim low-yield modules in the next subject.'],['never cut','sleep or chill time.'],['notes','if they take over 1.5x video time, write less.']]}
];
var grid=document.getElementById('grid'),sheets=document.getElementById('sheets'),home=document.getElementById('home');
function el(t,c,h){var x=document.createElement(t);if(c)x.className=c;if(h!=null)x.innerHTML=h;return x}
function rowsHtml(rows,live){return rows.map(function(r){
 if(r.length>=3&&/^\d\d:\d\d$/.test(r[0])){return '<div class="row" data-s="'+M(r[0])+'" data-e="'+M(r[1])+'"><div class="t">'+r[0]+' – '+r[1]+'</div><div><span class="w">'+r[2]+'</span>'+(r[3]?'<span class="n">'+r[3]+'</span>':'')+'</div></div>'}
 return '<div class="row"><div class="t">'+r[0]+'</div><div><span class="w">'+r[1]+'</span>'+(r[2]?'<span class="n">'+r[2]+'</span>':'')+'</div></div>'}).join('')}
function itemsHtml(it){return it.map(function(r){return '<div class="row item"><div><span class="w">'+r[0]+'</span><span class="n">'+r.slice(1).join(' · ')+'</span></div></div>'}).join('')}
D.forEach(function(d){
 var b=el('button','card'+(d.wide?' wide':''),'<span class="e">'+d.e+'</span><div><h2>'+d.name+'</h2><small>'+d.sub+'</small></div>');
 b.style.setProperty('--a','var('+d.a+')');b.onclick=function(){location.hash=d.id};grid.appendChild(b);
 var s=el('section','sheet');s.id='s-'+d.id;s.style.setProperty('--a','var('+d.a+')');
 var h='<button class="back">‹ all cards</button><div class="head"><h2>'+d.e+' '+d.name+'</h2><p>'+d.intro+'</p></div>';
 if(d.tabs){h+='<div class="tabs" role="tablist">'+d.tabs.map(function(t,i){return '<button class="tab" role="tab" aria-selected="'+(i==0)+'" data-i="'+i+'">'+t.n+'</button>'}).join('')+'</div><div class="list" id="tl"></div>'}
 else h+='<div class="list">'+(d.rows?rowsHtml(d.rows,d.live):itemsHtml(d.items))+'</div>';
 if(d.foot)h+='<p class="note">'+d.foot+'</p>';
 s.innerHTML=h;sheets.appendChild(s);
 s.querySelector('.back').onclick=function(){location.hash=''};
 if(d.tabs){var L=s.querySelector('#tl'),tb=s.querySelectorAll('.tab');
  var show=function(i){L.innerHTML='<p class="note" style="margin:0;padding:12px 14px 0">'+d.tabs[i].intro+'</p>'+rowsHtml(d.tabs[i].rows);tb.forEach(function(x,j){x.setAttribute('aria-selected',j==i)})};
  tb.forEach(function(x){x.onclick=function(){show(+x.dataset.i)}});show(0)}
});
function route(){var id=location.hash.slice(1),ok=D.some(function(d){return d.id==id});
 home.style.display=ok?'none':'block';
 document.querySelectorAll('.sheet').forEach(function(s){s.classList.toggle('on',s.id=='s-'+id)});
 window.scrollTo(0,0);mark()}
function mark(){var n=new Date(),m=n.getHours()*60+n.getMinutes();
 document.querySelectorAll('.row[data-s]').forEach(function(r){var on=m>=+r.dataset.s&&m<+r.dataset.e;r.classList.toggle('now',on)})}
window.addEventListener('hashchange',route);setInterval(mark,60000);route();
var end=new Date('2027-02-14T00:00:00'),left=Math.max(0,Math.ceil((end-new Date())/864e5));
document.getElementById('cd').textContent=left+' days';
document.getElementById('th').onclick=function(){var r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()=='#17131f';r.setAttribute('data-theme',dk?'light':'dark')};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
